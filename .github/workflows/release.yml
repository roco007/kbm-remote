name: Release

# Triggered manually or by pushing a version tag (e.g. v1.0.0).
# Builds the desktop receiver on all three platforms and publishes a GitHub release.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: nsis portable
            artifact: win
          - os: macos-latest
            target: dmg zip
            artifact: mac
          - os: ubuntu-latest
            target: appimage deb
            artifact: linux
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo
        run: pnpm build

      - name: Build receiver installer (${{ matrix.target }})
        working-directory: apps/receiver
        run: pnpm exec electron-builder --${{ matrix.target }} --config electron-builder.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.artifact }}
          path: apps/receiver/dist/release/*.{exe,msi,dmg,zip,AppImage,deb,blockmap,yml}
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release/
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          files: release/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
